<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Section 2 — Chọn lớp học phù hợp với con</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --white:#FFFFFF;
    --burgundy:#6B1E2B;
    --ink:#2B2421;
    --muted:#7A6E67;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Hind Siliguri",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--white);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .programs{
    position:relative;background:var(--white);
    max-width:1440px;margin:0 auto;
    min-height:1200px;overflow:hidden;
  }
  .desk-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  .desk-bg img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
  /* ---------- Heading : top ~15% ---------- */
  .programs-head{
    position:relative;z-index:3;text-align:center;
    padding:96px 24px 0;
  }
  .programs-title{
    font-family:"Tinos",Georgia,serif;font-weight:700;
    font-size:clamp(30px,2.9vw,42px);line-height:1.15;letter-spacing:-.01em;
    color:var(--burgundy);
  }
  .programs-sub{
    margin-top:12px;font-size:17px;font-weight:400;line-height:1.5;color:var(--muted);
  }
  /* ---------- Collage ---------- */
  .collage{position:relative;z-index:2;height:1000px}
  .photo{
    position:absolute;opacity:0;
    transform:translate(var(--tx),var(--ty)) rotate(var(--r0));
  }
  .photo .ph{
    box-shadow:0 2px 6px rgba(43,36,33,.10),0 20px 44px rgba(43,36,33,.13);
    background:#fff;
  }
  .photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
  .photo figcaption{
    margin-top:12px;font-size:15px;font-weight:600;line-height:1.4;
    color:var(--burgundy);white-space:nowrap;
  }
  .photo--a{width:300px;left:13%;top:62px;--r:-6deg;--r0:-10deg;--tx:-35px;--ty:20px;--d:0ms}
  .photo--b{width:340px;left:63%;top:8px;--r:5deg;--r0:10deg;--tx:40px;--ty:-20px;--d:110ms}
  .photo--c{width:290px;left:43%;top:348px;--r:-3deg;--r0:-6deg;--tx:0px;--ty:30px;--d:220ms}
  .photo--d{width:320px;left:16%;top:556px;--r:6deg;--r0:10deg;--tx:-30px;--ty:30px;--d:330ms}
  .photo--b figcaption{text-align:right}
  .collage.inview .photo{animation:settle 800ms cubic-bezier(.22,.9,.3,1) forwards;animation-delay:var(--d)}
  @keyframes settle{
    from{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r0))}
    to{opacity:1;transform:translate(0,0) rotate(var(--r))}
  }

  @media (max-width:1100px){
    .programs{min-height:1080px}
    .collage{height:900px}
    .photo--a{width:252px}
    .photo--b{width:288px;left:60%}
    .photo--c{width:244px;top:320px}
    .photo--d{width:270px;top:520px}
  }
  @media (max-width:720px){
    .programs{min-height:0}
    .programs-head{padding:64px 24px 0}
    .collage{
      height:auto;display:flex;flex-direction:column;gap:60px;
      padding:52px 0 88px;align-items:center;
    }
    .photo{position:relative;left:auto !important;top:auto !important;width:min(74vw,320px) !important}
    .photo--a{align-self:flex-start;margin-left:9vw}
    .photo--b{align-self:flex-end;margin-right:7vw}
    .photo--c{align-self:center}
    .photo--d{align-self:flex-start;margin-left:13vw}
    .photo figcaption{white-space:normal}
  }
  @media (prefers-reduced-motion:reduce){
    .photo{opacity:1;transform:rotate(var(--r))}
    .collage.inview .photo{animation:none}
  }
</style>
</head>
<body>
<section class="programs" aria-labelledby="programs-title" data-od-id="programs-section">
  <div class="desk-bg" aria-hidden="true">
    <img src="Gemini_Generated_Image_l5rmakl5rmakl5rm.png" alt="" loading="lazy" decoding="async" />
  </div>

  <div class="programs-head">
    <h2 class="programs-title" id="programs-title" data-od-id="programs-heading">Chọn lớp học phù hợp với con</h2>
    <p class="programs-sub" data-od-id="programs-sub">Mỗi độ tuổi và nhu cầu đều có một cách học phù hợp.</p>
  </div>

  <div class="collage" id="collage" data-od-id="programs-collage">
    <figure class="photo photo--a" data-od-id="program-photo-art">
      <div class="ph"><img src="Gemini_Generated_Image_56pnqb56pnqb56pn.png" alt="Lớp học vẽ: bé gái tự mình vẽ tranh bằng chì màu, cô giáo ở xa phía sau" loading="lazy" decoding="async" /></div>
      <figcaption>Lớp học vẽ</figcaption>
    </figure>
    <figure class="photo photo--b" data-od-id="program-photo-english">
      <div class="ph"><img src="Gemini_Generated_Image_gqksegqksegqkseg.png" alt="Tiếng Anh giao tiếp: bé trai đang trò chuyện bằng cử chỉ với cô giáo nước ngoài" loading="lazy" decoding="async" /></div>
      <figcaption>Tiếng Anh giao tiếp</figcaption>
    </figure>
    <figure class="photo photo--c" data-od-id="program-photo-tutoring">
      <div class="ph"><img src="Gemini_Generated_Image_xfvrlhxfvrlhxfvr.png" alt="Gia sư các cấp: bé trai chỉ vào vở, trao đổi trực tiếp với cô gia sư" loading="lazy" decoding="async" /></div>
      <figcaption>Gia sư các cấp</figcaption>
    </figure>
    <figure class="photo photo--d" data-od-id="program-photo-handwriting">
      <div class="ph"><img src="Gemini_Generated_Image_nyi3innyi3innyi3.png" alt="Tiền tiểu học và luyện chữ đẹp: bé gái tự luyện viết chữ trong vở" loading="lazy" decoding="async" /></div>
      <figcaption>Tiền tiểu học + luyện chữ đẹp</figcaption>
    </figure>
  </div>
</section>

<script>
(function(){
  var c = document.getElementById('collage');
  function show(){ c.classList.add('inview'); }
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ show(); io.disconnect(); } });
    },{threshold:.12});
    io.observe(c);
  } else { show(); }
})();
</script>
</body>
</html>
